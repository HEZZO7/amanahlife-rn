name: Native entitlement review
on:
  push:
    branches: [review/cross-platform-entitlement-security]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx expo export --platform android --output-dir /tmp/amanahlife-android-review
        env:
          EXPO_NO_TELEMETRY: '1'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/app_11941c8fec_ai_life_coach/index.ts supabase/functions/app_11941c8fec_receipt_scan/index.ts supabase/functions/app_11941c8fec_family_invite/index.ts
      - name: Runtime dependency advisory inventory
        run: |
          npm audit --omit=dev --json > /tmp/amanah-audit.json || true
          node -e 'const a=require("/tmp/amanah-audit.json"); if(a.error || !a.vulnerabilities) throw Error("Audit unavailable"); for(const [name,v] of Object.entries(a.vulnerabilities)) if(["critical","high"].includes(v.severity)) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via})); console.log(JSON.stringify(a.metadata.vulnerabilities));'
      - name: Candidate non-major dependency remediation
        run: |
          npm audit fix --package-lock-only --ignore-scripts --omit=dev || true
          npm ci --ignore-scripts
          npm audit --omit=dev --json > /tmp/amanah-candidate-audit.json || true
          node -e 'const a=require("/tmp/amanah-candidate-audit.json"); if(a.error || !a.vulnerabilities) throw Error("Audit unavailable"); console.log(JSON.stringify(a.metadata.vulnerabilities)); for(const [name,v] of Object.entries(a.vulnerabilities)) if(["critical","high"].includes(v.severity)) console.log(JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable}));'
          git diff --stat -- package.json package-lock.json
          npx expo export --platform android --output-dir /tmp/amanahlife-android-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation-candidate
          path: |
            package.json
            package-lock.json
          retention-days: 7
      - name: Inventory live references and export staging Android
        env:
          EXPO_PUBLIC_AMANAH_ENV: staging
          EXPO_PUBLIC_SUPABASE_URL: https://stagingfixture.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: fixture-public-key
          EXPO_NO_TELEMETRY: 1
        run: |
          git grep -l -E 'nyhsnvjdgifphwkqzwel|amanahlife\.lemonsqueezy\.com' -- src app || true
          npx expo export --platform android --output-dir /tmp/amanahlife-staging-review
